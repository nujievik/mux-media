name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: true
        default: 'v1.2.3'

env:
  CARGO_TERM_COLOR: always

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    env:
      PKG_NAME: mux-media
      NEW_PKGDESC: "CLI utility to mux (merge) video, audio, and subtitles"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set VERSION env
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VERSION="${{ github.event.inputs.version }}"
            echo "VERSION=${INPUT_VERSION#v}" >> $GITHUB_ENV
          else
            REF_VERSION="${{ github.ref_name }}"
            echo "VERSION=${REF_VERSION#v}" >> $GITHUB_ENV
          fi

      - name: Setup SSH Key for AUR
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$AUR_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/aur_key
          
          cat <<EOF > ~/.ssh/config
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config
          
          echo "=== AUR CONNECT CHECK ==="
          ssh -vT aur@aur.archlinux.org || true
          echo "====================================="

      - name: Clone AUR repo
        run: git clone "ssh://aur@aur.archlinux.org/${{ env.PKG_NAME }}.git" aur_repo

      - name: Update, Build and Test package in Arch docker
        run: |
          chmod -R 777 aur_repo
          
          docker run --rm \
            -v "$PWD/aur_repo:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c "
              sed -i 's/^pkgver=.*/pkgver=${{ env.VERSION }}/' PKGBUILD
              sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
              sed -i 's|^pkgdesc=.*|pkgdesc=\"${{ env.NEW_PKGDESC }}\"|' PKGBUILD
              
              pacman -Syu --noconfirm --needed base-devel pacman-contrib
              
              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /workspace
              
              sudo -u builder updpkgsums
              sudo -u builder makepkg --printsrcinfo > .SRCINFO

              sudo -u builder makepkg -s --noconfirm
            "

      - name: Commit and Push to AUR
        run: |
          cd aur_repo
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          
          git add PKGBUILD .SRCINFO
          
          if ! git diff-index --quiet HEAD; then
            echo "=== AUR CHANGES ==="
            git diff --cached
            echo "================================="
          else
            echo "No changes to commit."
          fi
